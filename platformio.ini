; Slider Sync Firmware — unified build (role configured via web UI, stored in NVS)
;
; First flash via USB:  pio run -e slider_usb -t upload --upload-port /dev/cu.usbmodemXXX
; OTA thereafter:       pio run -e slider     -t upload --upload-port slider-AABBCC.local

[env]
platform  = espressif32
framework = arduino
board     = esp32-s3-devkitc-1
monitor_speed = 115200
; Only compile src/main.cpp — the old leader/ and follower/ stubs are excluded.
build_src_filter = +<main.cpp>
lib_deps =
    https://github.com/gin66/FastAccelStepper/archive/refs/heads/master.zip
    https://github.com/mathieucarbou/ESPAsyncWebServer/archive/refs/tags/v3.3.23.zip
    bblanchon/ArduinoJson @ ^7.2.0
    olikraus/U8g2 @ ^2.35.19
board_build.partitions = default_16MB.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
lib_ignore = WebServer

[env:slider_usb]
upload_protocol = esptool

[env:slider]
upload_protocol = espota
upload_port     = slider-c58aa4.local
upload_flags    = --auth=slider-ota

; ── Network log monitors (telnet on port 23) ──────────────────────────────────
; Usage:  pio device monitor -e monitor_130
;         pio device monitor -e monitor_131

[env:monitor_130]
monitor_port = socket://192.168.128.130:23

[env:monitor_131]
monitor_port = socket://192.168.128.131:23
